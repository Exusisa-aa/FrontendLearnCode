<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let person = {
      person_name: '张三',
      age: 18,
      sex: '男',
      introduce: function () {
        document.write(`<h1>我的名字叫${this.person_name},今年${this.age}岁</h1>`)
      },
      sing: function () {
        document.write(`<h1>${this.person_name}在唱歌</h1>`)
      }
    }
    person.introduce()
    person.sing()
  </script>
</body>

</html>
