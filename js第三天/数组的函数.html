<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    span {
      background-color: red;
      margin: 30px;
      border: 1px solid black;
    }
  </style>
</head>

<body>
  <script>
    let arr = new Array(2) //数组的声明
    arr[0] = 'hello'
    arr[1] = 'world'
    arr.push('js')
    arr.unshift('java')
    for (let i = 0; i < arr.length; i++) {
      document.write(`<span>${arr[i]}</span>`)
    }

    let arr1 = [1, 2, 3, 4, 5, 6, 7, 8]
    arr1.pop()
    arr1.shift()
    arr1.splice(0, 1) //索引从零开始且包前不包后
    for (let i = 0; i < arr1.length; i++) {
      document.write(`<span>${arr1[i]}</span>`)
    }
  </script>
</body>

</html>
