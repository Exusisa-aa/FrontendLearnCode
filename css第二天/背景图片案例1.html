<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 146px;
      height: 40px;
      line-height: 40px;
      background-image: url(images/icon.png);
      background-repeat: no-repeat;
      background-position: left center;
      text-indent: 1.5em;
    }

    div a {
      text-decoration: none;
    }

    div a:link {
      color: #000;
    }

    div a:hover {
      color: orange;
    }
  </style>
</head>

<body>
  <div>
    <a href="#">成长守护平台</a>
  </div>
</body>

</html>
