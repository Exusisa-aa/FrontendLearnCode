<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    function People(name, age) {
      this.name = name;
      this.age = age;
    }
    //原型对象
    console.log(People.prototype)
    console.log(People.prototype.constructor)

    //对象原型
    const people = new People('张三', 18)
    console.log(people.__proto__)
    console.log(people.__proto__.constructor)

    console.log(people.__proto__ === People.prototype) //对象原型指向原型对象
    console.log(people.__proto__.constructor === People.prototype.constructor)//对象原型和原型对象的constructor指向同一个构造函数
  </script>
</body>

</html>
