<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //实例成员
    function Goods(name, price, count) {
      this.name = name
      this.price = price
      this.count = count
    }
    const mi = new Goods('小米', 1999, 20)
    const huawei = new Goods('华为', 3999, 50)
    const vivo = new Goods('vivo', 1888, 100)
    console.log(mi, huawei, vivo)

    //静态成员
    function Person(name, age) {
      this.name = name
      this.age = age
    }
    Person.eyes = 2
    Person.legs = 2
    Person.getEyes = function () {
      return this.eyes
    }
    console.log(Person.getEyes())
  </script>
</body>

</html>
