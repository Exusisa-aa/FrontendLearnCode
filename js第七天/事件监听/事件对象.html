<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <input class="test1" type="text">
  <button class="test2">点击我</button>
  <script>
    const c1 = document.querySelector('.test1')
    const c2 = document.querySelector('.test2')
    c2.addEventListener('click', function (e) {
      console.log(e.type)
      console.log(e.clientX)
      console.log(e.clientY)
      console.log(e.offsetX)
      console.log(e.offsetY)
    })
    c1.addEventListener('keyup', function (e) {
      if (e.key === 'Enter') {
        console.log('按下了回车键')
      } else if (e.key === ' ') {
        console.log('按下了空格键')
      }
    })
    c1.addEventListener('click', () => {
      console.log('点击了输入框')
    })

  </script>
</body>

</html>
