<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  li {
    list-style: none;
  }

  .big {
    width: 750px;
    height: 30px;
    margin: 0 auto;

  }

  .big ul li {
    float: left;
    width: 75px;
    height: 30px;
    line-height: 30px;
    text-align: center;
    background-color: red;
    transition: all 1s;
  }

  @media screen and (max-width: 768px) {
    .big {
      width: 100%;
    }

    .big ul li {
      width: 33.33%;
    }
  }
</style>

<body>
  <div class="big">
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
      <li>7</li>
      <li>8</li>
      <li>9</li>
      <li>10</li>
    </ul>
  </div>
</body>

</html>
