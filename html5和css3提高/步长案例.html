<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    @keyframes go {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-1600px, 0);
      }
    }

    @keyframes move {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(750px, 0);
      }

    }

    @keyframes dong {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-3840px, 0);
      }
    }

    .pic {
      position: relative;
    }

    .pic .bgi1 {
      position: absolute;
      width: 7680px;
      height: 336px;
      background-image: url(media/bg1.png);
      margin-top: 200px;
      animation: dong 10s linear 3s infinite;
    }

    .pic .bgi2 {
      position: absolute;
      width: 7680px;
      height: 569px;
      background-image: url(media/bg2.png);
      animation: dong 10s linear 3s infinite;
    }


    .pic .x {
      position: absolute;
      margin-top: 390px;
      width: 200px;
      height: 100px;
      overflow: hidden;
      animation: move 3s linear 0s forwards;
    }

    .pic .x img {
      width: 1600px;
      height: 100px;
      animation: go 0.7s steps(8) 0s infinite;
    }
  </style>
</head>

<body>


  <h1>案例奔跑的熊</h1>
  <div class="pic">
    <div class="bgi2"></div>
    <div class="bgi1"></div>
    <div class="x">
      <img src="media/bear.png">
    </div>
  </div>

</body>

</html>
