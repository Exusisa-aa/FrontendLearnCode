<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @keyframes go {
      0% {
        width: 1px;
        height: 1px;
        opacity: 1;
      }

      100% {
        width: 900px;
        height: 900px;
        opacity: 0;
      }
    }

    .box {
      position: relative;
      background-color: #303330;
    }

    .box img {
      width: 100%;
      height: 100%;
    }

    .box .bw {
      position: absolute;
      width: 500px;
      height: 500px;
      top: 0;
      left: 0;
    }

    .box .dot {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 5px;
      height: 5px;
      background-color: red;
      border: 1px solid red;
      border-radius: 50%;
    }

    .box .bw div[class*="outcircle"] {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 1px;
      height: 1px;
      border: 1px solid red;
      border-radius: 50%;
      box-shadow: 0 0 5px 5px red;
    }

    .box .bw .outcircle1 {
      animation: go 0.8s linear 0s infinite;
    }

    .box .bw .outcircle2 {
      animation: go 0.8s linear 0.5s infinite;
    }

    .box .bw .outcircle3 {
      animation: go 0.8s linear 1s infinite;
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="media/map.png">
    <div class="bw">
      <div class="dot"></div>
      <div class="outcircle1"></div>
      <div class="outcircle2"></div>
      <div class="outcircle3"></div>
    </div>
  </div>
</body>

</html>
