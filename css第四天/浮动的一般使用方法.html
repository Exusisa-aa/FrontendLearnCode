<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .c {
      width: 600px;
      height: 200px;
      background-color: grey;
      margin: 0 auto;
    }

    .a {
      width: 50px;
      height: 200px;
      background-color: red;
      float: left;
    }

    .b {
      width: 50px;
      height: 200px;
      background-color: green;
      float: right;
    }
  </style>
</head>

<body>
  <div class="c">
    <div class="a"></div>
    <div class="b"></div>
    <div style="text-align: center;">一般与父级标准流标签一起使用，方便布局</div>
  </div>

</body>

</html>
