<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  @keyframes bb {
    0% {
      width: 0;
    }

    100% {
      width: 410px;
    }
  }

  .bc {
    font-size: 30px;
    width: 410px;
    height: 38px;
    background-color: red;
    animation: bb 5s steps(23) 0s infinite;
    overflow: hidden;
  }
</style>

<body>
  <div class="bc">12345678910111213141516</div>
</body>

</html>
