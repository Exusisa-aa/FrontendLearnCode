<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let score = Number(prompt('请输入数字'))
    if (score === 100) {
      document.write('完美')
      alert('恭喜你')
    } else if (score >= 90) {
      document.write('优秀')
      alert('恭喜你')
    } else if (score >= 80) {
      document.write('良好')
      alert('恭喜你')
    } else if (score >= 70) {
      document.write('中等')
    } else if (score >= 60) {
      document.write('及格')
    } else {
      document.write('不及格')
    }
  </script>
</body>

</html>
