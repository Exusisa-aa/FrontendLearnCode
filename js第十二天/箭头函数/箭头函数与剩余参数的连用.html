<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //箭头函数不支持arguments，支持剩余参数
    const fn = (...others) => {
      let sum = 0
      for (let i = 0; i < others.length; i++) {
        sum += others[i]
      }
      return sum
    }
    console.log(fn(1, 2, 3, 4, 5))
  </script>
</body>

</html>
