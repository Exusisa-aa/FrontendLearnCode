<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .a {
      width: 600px;
      background-color: greenyellow;
      border: 2px solid orangered;
    }

    .b {
      background-color: pink;
      width: 100px;
      height: 200px;
      float: left;
    }

    .c {
      background-color: yellow;
      width: 100px;
      height: 200px;
      float: left;
      margin-left: 50px;
    }

    .e {
      width: 800px;
      height: 200px;
      background-color: black;
    }

    .d {
      clear: both;
    }

    .f {
      width: 600px;
      background-color: greenyellow;
      border: 2px solid orangered;
      overflow: hidden;
    }

    .g {
      background-color: pink;
      width: 100px;
      height: 200px;
      float: left;
    }

    .h {
      background-color: yellow;
      width: 100px;
      height: 200px;
      float: left;
      margin-left: 50px;
    }

    .i {
      width: 800px;
      height: 200px;
      background-color: black;
    }
  </style>
</head>

<body>
  <h1>清除浮动之隔墙法</h1>
  <div class="a">
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
  </div>
  <div class="e"></div>
  <h1>清除浮动之overflow</h1>
  <div class="f">
    <div class="g"></div>
    <div class="h"></div>
  </div>
  <div class="i"></div>
</body>

</html>
