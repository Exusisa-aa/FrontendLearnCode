<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>

<body>
  <script>
    let num1 = Number(prompt("请输入商品价格"))
    let num2 = Number(prompt("请输入总数"))
    let loca = prompt("请输入地址")
  </script>
  <table border="1" cellpadding="30" cellspacing="0" width="800">
    <tr>
      <th>商品名称</th>
      <th>商品价格</th>
      <th>商品数量</th>
      <th>总价</th>
      <th>收货地址</th>
    </tr>
    <tr>
      <td>
        小米手机青春PLUS
      </td>
      <td>
        <script>
          document.write(`${num1}元`)
        </script>
      </td>
      <td>
        <script>
          document.write(num2)
        </script>
      </td>
      <td>
        <script>
          document.write(`${num1 * num2}元`)
        </script>
      </td>
      <td>
        <script>
          document.write(loca)
        </script>
      </td>
    </tr>

  </table>
</body>

</html>
