<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .box {
    width: 200px;
    height: 200px;
    background-color: #5c5959;
    color: white;
  }
</style>

<body>
  <div class="box"></div>
  <script src="lodash.min.js"></script>
  <script>
    let i = 0
    document.querySelector('.box').innerHTML = i
    document.querySelector('.box').addEventListener('mousemove', _.throttle(function () {
      i++
      document.querySelector('.box').innerHTML = i
    }, 5000))
  </script>
</body>

</html>
