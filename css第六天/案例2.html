<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .tudou {
      position: relative;
      width: 500px;
      height: 300px;
      margin: 30px auto;
    }

    .tudou img {
      width: 100%;
      height: 100%;
    }

    .tudou .mask {
      width: 500px;
      height: 300px;
      position: absolute;
      background-color: rgba(0, 0, 0, 0.3);
      top: 0;
      left: 0;
      display: none;
    }

    .tudou .mask a img {
      width: 50px;
      height: 50px;
      position: absolute;
      top: 50%;
      margin-top: -25px;
      left: 50%;
      margin-left: -25px;
    }

    .tudou:hover .mask {
      display: block;
    }
  </style>
</head>

<body>
  <div class="tudou">
    <img src="images/tudou.jpg">
    <div class="mask">
      <a href="#">
        <img src="images/arr.png">
      </a>
    </div>
  </div>
</body>

</html>
