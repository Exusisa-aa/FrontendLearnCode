<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let num1 = Number(prompt('请输入数字:'))
    document.write(num1)
    document.write(' ')
    document.write(typeof num1)
    document.write(' ')

    let num2 = parseInt(prompt('请输入数字:'))
    document.write(num2)
    document.write(' ')
    document.write(typeof num2)
    document.write(' ')

    let num3 = parseFloat(prompt('请输入数字:'))
    document.write(num3)
    document.write(' ')
    document.write(typeof num3)
  </script>
</body>

</html>
