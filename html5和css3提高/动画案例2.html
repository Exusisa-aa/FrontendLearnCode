<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  @keyframes out {
    0% {
      width: 1px;
      height: 1px;
      opacity: 1;
    }

    100% {
      width: 90px;
      height: 90px;
      opacity: 0;
    }
  }

  .pic {
    position: relative;
    width: 700px;
    height: 700px;
    background-color: #303330;
    margin: 0 auto;
  }

  .pic img {
    width: 100%;
    height: 100%;
  }

  .pic .box {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 1px solid white;
    left: 0;
    top: 0;
  }

  .pic .box .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    background-color: red;
    border: 1px solid red;
    border-radius: 50%;
  }

  .pic .box div[class*="outcircle"] {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1px;
    height: 1px;
    border: 10px solid red;
    border-radius: 50%;
    box-shadow: 0 0 2px 2px rgb(255, 0, 0);
  }

  .pic .box .outcircle1 {
    animation: out 1s linear 0s infinite;
  }

  .pic .box .outcircle2 {
    animation: out 1s linear 0.5s infinite;
  }

  .pic .box .outcircle3 {
    animation: out 1s linear 1s infinite;
  }
</style>

<body>
  <div class="pic">
    <img src="media/map.png">
    <div class="box">
      <div class="dot"></div>
      <div class="outcircle1"></div>
      <div class="outcircle2"></div>
      <div class="outcircle3"></div>
    </div>
  </div>
</body>

</html>
