<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论回车发布</title>
  <style>
    .wrapper {
      min-width: 400px;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: url(./images/avatar.jpg) no-repeat center / cover;
      margin-right: 20px;
    }

    .wrapper textarea {
      outline: none;
      border-color: transparent;
      resize: none;
      background: #f5f5f5;
      border-radius: 4px;
      flex: 1;
      padding: 10px;
      transition: all 0.5s;
      height: 30px;
    }

    .wrapper textarea:focus {
      border-color: #e4e4e4;
      background: #fff;
      height: 50px;
    }

    .wrapper button {
      background: #00aeec;
      color: #fff;
      border: none;
      border-radius: 4px;
      margin-left: 10px;
      width: 70px;
      cursor: pointer;
    }

    .wrapper .total {
      margin-right: 80px;
      color: #999;
      margin-top: 5px;
      opacity: 0;
      transition: all 0.5s;
    }

    .list {
      min-width: 400px;
      max-width: 800px;
      display: inline-block;
    }

    .list .item {
      width: 100%;
      display: flex;
    }

    .list .item .info {
      flex: 1;
      border-bottom: 1px dashed #e4e4e4;
      padding-bottom: 10px;
    }

    .list .item p {
      margin: 0;
    }

    .list .item .name {
      color: #FB7299;
      font-size: 14px;
      font-weight: bold;
    }

    .list .item .text {
      color: #333;
      padding: 10px 0;
    }

    .list .item .time {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <i class="avatar"></i>
    <textarea class="ta" id="tx" placeholder="发一条友善的评论" rows="2" maxlength="200"></textarea>
    <button>发布</button>
  </div>
  <div class="wrapper">
    <span class="total">0/200字</span>
  </div>
  <div class="list"></div>
  <script>
    const cta = document.querySelector('.ta')
    const ct = document.querySelector('.total')
    const cl = document.querySelector('.list')
    cta.addEventListener('focus', function () {
      ct.style.opacity = 1
    })
    cta.addEventListener('blur', function () {
      ct.style.opacity = 0
    })
    cta.addEventListener('input', function () {
      ct.innerHTML = `${cta.value.length}/200字`
    })

    const cb = document.querySelector('button')
    cb.addEventListener('click', function () {
      let date = new Date()
      if (!cta.value.trim()) {
        cta.value = ''
        ct.innerHTML = '0/200字'
        alert('评论不能为空')
        return
      }
      cl.insertAdjacentHTML('beforeend', `
           <div class="item">
            <i class="avatar"></i>
            <div class="info">
              <p class="name">清风徐来</p>
              <p class="text">${cta.value}</p>
              <p class="time">${date.toLocaleDateString() + "  " + date.toLocaleTimeString()}</p>
            </div>
           </div>
                            `)
      ct.innerHTML = '0/200字'
      cta.value = ''
    })

    cta.addEventListener('keyup', function (e) {
      let date = new Date()
      if (e.key === 'Enter') {
        if (!cta.value.trim()) {
          cta.value = ''
          ct.innerHTML = '0/200字'
          alert('评论不能为空')
          return
        }
        cl.insertAdjacentHTML('beforeend', `
           <div class="item">
            <i class="avatar"></i>
            <div class="info">
              <p class="name">清风徐来</p>
              <p class="text">${cta.value}</p>
              <p class="time">${date.toLocaleDateString() + " " + date.toLocaleTimeString()}</p>
            </div>
           </div>
                            `)
        ct.innerHTML = '0/200字'
        cta.value = ''
      }
    })
  </script>

</body>

</html>
