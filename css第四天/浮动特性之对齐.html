<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .a {
      float: left;
      width: 200px;
      height: 300px;
      background-color: gold;
    }

    .b {
      float: left;
      width: 200px;
      height: 350px;
      background-color: black;
    }

    .c {
      float: left;
      width: 200px;
      height: 400px;
      background-color: red;
    }

    .d {
      float: left;
      width: 200px;
      height: 450px;
      background-color: purple;
    }
  </style>
</head>

<body>
  <div class="a"></div>
  <div class="b"></div>
  <div class="c">超过屏幕范围自动换行</div>
  <div class="d">顶端对齐</div>
</body>

</html>
