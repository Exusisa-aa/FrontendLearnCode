<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    .box {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      margin: 0 auto;
      transition: all 1s;
      transform-style: preserve-3d;
    }

    .box .y1 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: red;
      line-height: 300px;
      text-align: center;
      transform: rotateY(180deg);
      font-size: 40px;
      color: white;
      backface-visibility: hidden;
    }

    .box .y2 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: skyblue;
      line-height: 300px;
      text-align: center;
      font-size: 40px;
      color: white;
      backface-visibility: hidden;
    }

    .box:hover {
      transform: rotateY(180deg);
    }

    .navbox {
      margin: 0 auto;
      border: 1px solid red;
      width: 950px;
      height: 90px;
    }

    li {
      list-style: none;

    }

    .navbox ul .yy {
      position: relative;
      float: left;
      width: 150px;
      height: 70px;
      margin: 10px 20px;
      perspective: 500px;
    }

    .navbox ul .yy a {
      position: absolute;
      float: left;
      width: 150px;
      height: 70px;
      left: 0;
      top: 0;
      transform-style: preserve-3d;
      transition: all 1s;
    }

    .navbox ul .yy a li[class*="up"] {
      position: absolute;
      width: 150px;
      height: 70px;
      background-color: red;
      text-align: center;
      line-height: 70px;
      color: white;
      font-size: 30px;
      transform: translateZ(35px);
    }

    .navbox ul .yy a li[class*="down"] {
      position: absolute;
      width: 150px;
      height: 70px;
      background-color: skyblue;
      text-align: center;
      line-height: 70px;
      color: white;
      font-size: 20px;
      transform: translateY(35px) rotateX(-90deg);
    }

    .navbox ul .yy a:hover {
      transform: rotateX(90deg);
    }

    .outbox {
      perspective: 500px;
      width: 1000px;
      height: 500px;
      margin: 0 auto;
      border: 1px solid red;
      margin-top: 20px;
    }

    .inbox {
      transform-style: preserve-3d;
      position: relative;
      width: 800px;
      height: 400px;
      margin: 0 auto;
      margin-top: 50px;
      transition: all 1s;
      animation: zhuan 3s linear 0s infinite;
    }



    img {
      position: absolute;
      width: 35%;
      height: 50%;
      top: 50%;
      left: 50%;
      margin-left: -140px;
      margin-top: -100px;
    }

    @keyframes zhuan {
      0% {
        transform: rotateY(0);
      }

      100% {
        transform: rotateY(360deg);
      }
    }

    .i1 {
      transform: translate(0, 0);
    }

    .i2 {
      transform: translate3d(0, 0, 300px);
    }

    .i3 {
      transform: rotateY(60deg) translate3d(0, 0, 300px);
    }

    .i4 {
      transform: rotateY(120deg) translate3d(0, 0, 300px);
    }

    .i5 {
      transform: rotateY(180deg) translate3d(0, 0, 300px);
    }

    .i6 {
      transform: rotateY(240deg) translate3d(0, 0, 300px);
    }

    .i7 {
      transform: rotateY(300deg) translate3d(0, 0, 300px);
    }
  </style>
</head>

<body>
  <h1>案例1</h1>
  <div class="box">
    <div class="y1">看什么看</div>
    <div class="y2">sb</div>
  </div>
  <h1>案例2</h1>
  <div class="navbox">
    <ul>
      <div class="yy">
        <a href="#">
          <li class="up1">sb</li>
          <li class="down1">我阐述你的梦</li>
        </a>
      </div>
      <div class="yy">
        <a href="#">
          <li class="up1">sb</li>
          <li class="down1">我阐述你的梦</li>
        </a>
      </div>
      <div class="yy">
        <a href="#">
          <li class="up1">sb</li>
          <li class="down1">我阐述你的梦</li>
        </a>
      </div>
      <div class="yy">
        <a href="#">
          <li class="up1">sb</li>
          <li class="down1">我阐述你的梦</li>
        </a>
      </div>
      <div class="yy">
        <a href="#">
          <li class="up1">sb</li>
          <li class="down1">我阐述你的梦</li>
        </a>
      </div>
    </ul>
  </div>
  <h1>案例3</h1>
  <div class="outbox">
    <div class="inbox">
      <img src="media/红刀哥1.jpg" class="i1">
      <img src="media/草原.jpg" class="i2">
      <img src="media/草原.jpg" class="i3">
      <img src="media/草原.jpg" class="i4">
      <img src="media/草原.jpg" class="i5">
      <img src="media/草原.jpg" class="i6">
      <img src="media/草原.jpg" class="i7">
    </div>
  </div>
  <div style="margin-top: 50px;"></div>
</body>

</html>
