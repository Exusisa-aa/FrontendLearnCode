<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    document.write(`<h1>${Math.floor(Math.random() * (10 + 1))}</h1>`)
    document.write(`<h1>${Math.floor(Math.random() * (5 + 1)) + 5}</h1>`)
    function random(N, M) {
      return (Math.floor(Math.random() * (M - N + 1)) + N)
    }
    document.write(`<h1>${random(1, 100)}</h1>`)
  </script>
</body>

</html>
