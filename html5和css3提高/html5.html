<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    input::placeholder {
      color: red;
    }
  </style>
  <style>
    header {
      width: 500px;
      height: 100px;
      line-height: 100px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }

    nav {
      width: 500px;
      height: 30px;
      line-height: 30px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }

    article {
      width: 250px;
      height: 50px;
      line-height: 50px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }

    section {
      width: 250px;
      height: 50px;
      line-height: 50px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }

    aside {
      width: 100px;
      height: 200px;
      line-height: 200px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }

    footer {
      width: 700px;
      height: 300px;
      line-height: 300px;
      background-color: red;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>头部标签header</h1>
  <header>头部标签</header>
  <h1>导航栏标签nav</h1>
  <nav>导航栏标签</nav>
  <h1>内容标签article</h1>
  <article>内容标签</article>
  <h1>定义区域标签section</h1>
  <section>定义区域标签</section>
  <h1>侧边栏标签aside</h1>
  <aside>侧边栏标签</aside>
  <h1>尾部标签footer</h1>
  <footer>尾部标签</footer>
  <h1>视频标签video</h1>
  <video src="media/mi.mp4" autoplay="autoplay" controls="controls" width="800px" height="200px" loop="loop"
    poster="media/mi9.jpg" muted="muted"></video>
  <h1>音频标签audio</h1>
  <audio src="media/Da Capo.mp3" controls="controls" autoplay="autoplay" loop="loop"></audio>
  <h1>新增表单类型input</h1>
  <form action="">
    <ul>
      <li>邮箱：<input type="email"></li>
      <li>地址：<input type="url"></li>
      <li>日期：<input type="date"></li>
      <li>时间：<input type="time"></li>
      <li>月份：<input type="month"></li>
      <li>周类型；<input type="week"></li>
      <li>数字：<input type="number"></li>
      <li>搜索：<input type="search"></li>
      <li>手机号码：<input type="tel"></li>
      <li>颜色：<input type="color"></li>
      <li><input type="submit"></li>
    </ul>
  </form>
  <h1>新增表单类型非input</h1>
  <form action="">
    <ul>
      <li>搜索：<input type="search" name="ss" required="required" placeholder="美国大选最新情报" autofocus="autofocus"
          autocomplete="on"></li>
      <li><input type="file" multiple="multiple"></li>
    </ul>
  </form>
</body>

</html>
