<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>emmet语法之生成HTML标签</h1>
  <div>1.直接输标签名＋回车，如div+回车</div>
  <div>2.生成多个同标签，用标签名+*+数字+回车</div>
  <div>3.如果生成父子关系，用>,如ui>li+回车</div>
  <div>4.如果生成兄弟关系，用+，如dt+dd+回车或p+div+回车</div>
  <div>5.如果生成带类名或id的标签，用标签名+.类名/#id名+回车，如p.demo p#demo</div>
  <div>6.若生成自增序号，用$,如p.demo$*5</div>
  <div>7.可用{}提前输入标签的内容，如div{内容}+回车</div>
  <h1>emmet语法之生成css样式</h1>
  div{直接写首字母＋数字或首字母}

</body>

</html>
