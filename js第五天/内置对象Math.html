<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    document.write(`<h1>${Math.PI}</h1>`)
    document.write(`<h1>${Math.random()}</h1>`)
    document.write(`<h1>${Math.ceil(1.2)}</h1>`)
    document.write(`<h1>${Math.floor(1.2)}</h1>`)
    document.write(`<h1>${Math.round(1.6)}</h1>`)
    document.write(`<h1>${Math.max(1, 2, 3, 4, 5, 6, 7, 8)}</h1>`)
    document.write(`<h1>${Math.min(1, 2, 3, 4, 5, 6, 7, 8)}</h1>`)
    document.write(`<h1>${Math.pow(2, 3)}</h1>`)
    document.write(`<h1>${Math.abs(-2)}</h1>`)
  </script>
</body>

</html>
