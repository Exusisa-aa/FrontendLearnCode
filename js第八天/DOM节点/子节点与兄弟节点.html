<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>
  <script>
    const ul = document.querySelector('ul')
    for (let i = 0; i < ul.children.length; i++) {
      ul.children[i].addEventListener('click', function () {
        this.style.color = 'red'
      })
    }

    const li = document.querySelector('li:nth-child(3)')
    li.nextElementSibling.addEventListener('click', function () {
      this.style.color = 'green'
    })
    li.previousElementSibling.addEventListener('click', function () {
      this.style.color = 'green'
    })
  </script>
</body>

</html>
