<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .test1 {
    width: 300px;
    height: 300px;
    background-color: red;
    border: 3px solid green;
  }

  .test2 {
    width: 400px;
    height: 400px;
    background-color: black;
    border: 3px solid red;
  }

  .test3 {
    width: 500px;
    height: 500px;
    background-color: pink;
    border: 3px solid blue;
  }
</style>

<body>
  <div class="test"></div>
  <script>
    const c = document.querySelector(".test")
    c.classList.add("test1")
    c.classList.remove("test1")
    c.classList.toggle("test2")//有则删没有则加
    c.classList.toggle("test2")
    c.classList.toggle("test3")
  </script>
</body>

</html>
