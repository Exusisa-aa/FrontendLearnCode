<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>点击</button>
  <script>
    //匿名函数无法解绑
    const btn = document.querySelector('button')
    function fn() {
      alert('点击了')
      btn.removeEventListener('click', fn)
    }
    btn.addEventListener('click', fn)
  </script>
</body>

</html>
