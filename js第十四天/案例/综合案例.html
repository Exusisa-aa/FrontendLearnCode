<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面向对象封装消息提示</title>
  <style>
    .modal {
      width: 300px;
      min-height: 100px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      position: fixed;
      z-index: 999;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      background-color: #fff;
    }

    .modal .header {
      line-height: 40px;
      padding: 0 10px;
      position: relative;
      font-size: 20px;
    }

    .modal .header i {
      font-style: normal;
      color: #999;
      position: absolute;
      right: 15px;
      top: -2px;
      cursor: pointer;
    }

    .modal .body {
      text-align: center;
      padding: 10px;
    }

    .modal .footer {
      display: flex;
      justify-content: flex-end;
      padding: 10px;
    }

    .modal .footer a {
      padding: 3px 8px;
      background: #ccc;
      text-decoration: none;
      color: #fff;
      border-radius: 2px;
      margin-right: 10px;
      font-size: 14px;
    }

    .modal .footer a.submit {
      background-color: #369;
    }
  </style>
</head>

<body>
  <button id="delete">删除</button>
  <button id="login">登录</button>
  <button id="add">添加</button>

  <!-- <div class="modal">
    <div class="header">温馨提示 <i>x</i></div>
    <div class="body">您没有删除权限操作</div>
  </div> -->


  <script>
    // const deleteModal = new Modal('温馨提示','您没有删除权限操作')
    // const loginModal = new Modal('友情提示','您没有注册账号')
    function Modal(title, content) {
      const bigModal = document.createElement('div')
      bigModal.classList.add("modal")
      const header = document.createElement('div')
      header.classList.add('header')
      header.innerHTML = `${title}<i>x</i>`
      const body = document.createElement('div')
      body.classList.add('body')
      body.innerHTML = content
      bigModal.appendChild(header)
      bigModal.appendChild(body)

      this.bigModal = bigModal
    }


    Modal.prototype.open = function () {
      if (document.querySelector('.modal') != null) {
        document.body.removeChild(document.querySelector('.modal'))
      }
      document.body.appendChild(this.bigModal)
      document.querySelector('.modal .header i').addEventListener('click', () => {
        this.close()
      })
    }

    Modal.prototype.close = function () {
      document.body.removeChild(this.bigModal)
    }

    document.querySelector('#delete').addEventListener('click', () => {
      const deleteModal = new Modal('温馨提示', '您没有删除权限操作')
      deleteModal.open()
    })

    document.querySelector('#login').addEventListener('click', () => {
      const loginModal = new Modal('友情提示', '您没有注册账号')
      loginModal.open()
    })

    document.querySelector('#add').addEventListener('click', () => {
      const addModal = new Modal('提示', '您没有添加权限操作')
      addModal.open()
    })



  </script>
</body>

</html>
