<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="a"></div>
  <script>
    const p = new Promise((resolve, reject) => {
      const params = new URLSearchParams({
        pname: "广东省",
        cname: "深圳市"
      })
      const xhr = new XMLHttpRequest()
      xhr.open('get', `https://hmajax.itheima.net/api/area?${params}`)
      xhr.addEventListener('loadend', function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(JSON.parse(xhr.response))
        } else {
          reject(new Error(xhr.response))
        }
      })
      xhr.send()
    })

    p.then(result => {
      document.querySelector('.a').innerHTML = result.list.join('<br>')
    }).catch(error => {
      console.dir(error)
      document.querySelector('.a').innerHTML = error.message
    })
  </script>
</body>

</html>
