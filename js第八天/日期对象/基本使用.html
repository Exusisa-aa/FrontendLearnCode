<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>

</style>

<body>
  <script>
    const date1 = new Date()
    const date2 = new Date('2020-01-01 00:00:00')
    console.log(date1)
    console.log(date2)

    document.write(date1.getFullYear())
    document.write('</br>')
    document.write(date1.getMonth() + 1)
    document.write('</br>')
    document.write(date1.getDate())
    document.write('</br>')
    document.write(date1.getDay())
    document.write('</br>')
    document.write(date1.getHours())
    document.write('</br>')
    document.write(date1.getMinutes())
    document.write('</br>')
    document.write(date1.getSeconds())
    document.write('</br>')
    document.write(date1.toLocaleString())
    document.write('</br>')
    document.write(date1.toLocaleDateString())
    document.write('</br>')
    document.write(date1.toLocaleTimeString())

  </script>
</body>

</html>
