<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .a {
      cursor: default;
    }

    .b {
      cursor: pointer;
    }

    .c {
      cursor: move;
    }

    .d {
      cursor: text;
    }

    .e {
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <ul>
    <li class="a">小白默认default</li>
    <li class="b">小手pointer</li>
    <li class="c">移动move</li>
    <li class="d">文本text</li>
    <li class="e">禁止not-allowed</li>
  </ul>
</body>

</html>
