<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .one {
      width: 100px;
      height: 100px;
      background-color: red;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .more {
      word-break: break-all;
      width: 100px;
      height: 100px;
      background-color: red;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-camp: 2;
      -webkit-box-align: vertical;
    }
  </style>
</head>

<body>
  <h1>单行文本的省略号显示</h1>
  <div class="one">
    1111111111111111111111111111111111111111111111111111111111111111
  </div>
  <ul>
    <li>1.用white-space: nowrap;强制一行显示</li>
    <li>2.用overflow: hiiden;隐藏漏出的部分</li>
    <li>3.用text-overflow: ellipsis(省略号);把溢出部分换成省略号</li>
  </ul>
  <h1>多行文本的省略号显示</h1>
  <div class="more">
    1111111111111111111111111111
</body>

</html>
