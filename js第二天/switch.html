<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let num1 = Number(prompt('请输入数字1'))
    let num2 = Number(prompt('请输入数字2'))
    let num = prompt('请输入运算符')
    switch (num) {
      case '+':
        alert(num1 + num2)
        break
      case '-':
        alert(num1 - num2)
        break
      case '*':
        alert(num1 * num2)
        break
      case '/':
        alert(num1 / num2)
        break
      default:
        alert('请输入正确的运算符')
        break
    }
  </script>
</body>

</html>
