<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .a {
      background-color: red;
      width: 300px;
      height: 180px;
      border-radius: 100px;
    }

    .b {
      margin-top: 30px;
      background-color: red;
      width: 600px;
      height: 80px;
      text-align: center;
      padding-top: 50px;
      border-radius: 40px;
    }

    .c {
      margin-top: 30px;
      background-color: red;
      width: 300px;
      height: 180px;
      border-radius: 20px 40px 60px 80px;
    }

    .d {
      margin-top: 30px;
      background-color: white;
      height: 150px;
      width: 300px;
      text-align: center;
      padding-top: 150px;
    }

    .d:hover {
      box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, 0.3)
    }

    .e {
      margin: 30px;
      color: orangered;
      font-size: 50px;
      font-weight: bold;
      text-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5)
    }

    .f {
      width: 200px;
      height: 200px;
      background-color: orangered;
      float: left;
    }

    .g {
      width: 200px;
      height: 200px;
      background-color: orangered;
      float: left;
    }

    .h {
      width: 200px;
      height: 200px;
      background-color: orangered;
      float: right;
    }

    .i {
      width: 200px;
      height: 200px;
      background-color: orangered;
      margin-top: 300px;
    }
  </style>
</head>

<body>
  <div class="a" style="text-align: center; padding-top: 130px;">radius是半径</div>
  <div class="b">矩形圆角</div>
  <div class="c" style="text-align: center; padding-top: 130px;">复合写法</div>
  <div class="d">摸一下</div>
  <div class="e">我有影子辣</div>
  <h1>float浮动的用法</h1>
  <div class="f"></div>
  <div class="g"></div>
  <div class="h"></div>
  <div class="i"></div>
</body>

</html>
