<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .tb-promo {
      margin: 100px auto;
      width: 520px;
      height: 280px;
      position: relative;
    }

    .tb-promo img {
      width: 100%;
    }

    .prev,
    .next {
      position: absolute;
      text-decoration: none;
      width: 20px;
      height: 30px;
      top: 50%;
      margin-top: -15px;
      line-height: 30px;
      background-color: rgba(0, 0, 0, 0.3);
      color: white;
    }

    .prev {
      left: 0;
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    .next {
      right: 0;
      text-align: right;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
    }

    li {
      list-style: none;
    }

    .promo-nav {
      position: absolute;
      width: 80px;
      height: 15px;
      left: 50%;
      margin-left: -40px;
      top: 255px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .promo-nav ul li {
      float: left;
    }

    .promo-nav ul li a {
      display: block;
      background-color: white;
      width: 8px;
      height: 8px;
      margin: 4px 4px;
      border-radius: 100%;
    }

    .promo-nav ul li a:hover {
      background-color: orangered;
    }
  </style>
</head>

<body>
  <div class="tb-promo">
    <a href="#">
      <img src="images/tb.jpg">
    </a>
    <a href="#" class="prev">&lt;</a>
    <a href="#" class="next">&gt;</a>
    <div class="promo-nav">
      <ul>
        <li><a href="#" style="background-color: orangered;"></a></li>
        <li><a href="#"></a></li>
        <li><a href="#"></a></li>
        <li><a href="#"></a></li>
        <li><a href="#"></a></li>
      </ul>
    </div>
  </div>
</body>

</html>
