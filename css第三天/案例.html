<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      background-color: #f3f5f2;
    }

    .nav {
      width: 370px;
      height: 500px;
      background-color: #ffffff;
      margin: 0 auto;
      border: 1px solid transparent;
    }

    .talk {
      padding-top: 30px;
      text-align: center;
      background-color: white;
    }

    .comment {
      margin-top: 70px;
      padding-left: 24px;
      color: #b5b7b6;
      background-color: white;
    }

    .link {
      margin-top: 30px;
      padding-left: 24px;
      display: inline-block;
      background-color: white;
    }

    .link:link {
      color: black;
    }

    .link:visited {
      color: black;
    }

    .line {
      margin-top: 30px;
      margin-left: 10px;
      display: inline-block;
      background-color: white;
      color: #dbdde2;
    }

    .price {
      margin-top: 30px;
      padding-left: 10px;
      display: inline-block;
      background-color: white;
      color: orangered;
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="photo">
      <a href="#">
        <img src="images/img.jpg" style="width: 100%;">
      </a>
    </div>
    <p class="talk">快递牛，整体不错蓝牙可以说秒连。红米给力</p>
    <div class="comment">来自于117384232的评价</div>
    <div class="link">
      <a href="#" style="text-decoration: none; color: black; background-color: white;">
        Redmi AirDots真无线蓝...
      </a>
    </div>
    <div class="line">|</div>
    <div class="price">99.9元</div>
  </div>
</body>

</html>
