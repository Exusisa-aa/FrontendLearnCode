<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let number = 1
    let total = 0
    while (number <= 101) {
      if (number === 101) {
        number++
        continue
      }
      total += number
      document.write(total + '<br>')
      number++
    }
  </script>
</body>

</html>
